name: Normalize OMIX primary domain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace legacy OMIX domain
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'https://omixsystems.com': 'https://omixsystems.store',
              'http://omixsystems.com': 'https://omixsystems.store',
          }
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit normalized links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No legacy OMIX domain references found."
            exit 0
          fi
          git add -A
          git commit -m "chore: use omixsystems.store as primary domain"
          git push
