name: Rename Phikila to Decimal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: ${{ !contains(github.event.head_commit.message, 'Rename Phikila to Decimal') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace references
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -i 'phikila' -- ':!*.yml' ':!*.yaml' ':!*.json' || true)
          if [ -z "$files" ]; then
            echo 'No Phikila references found.'
            exit 0
          fi
          while IFS= read -r file; do
            perl -0pi -e 's#https?://(?:www\.)?phikila\.com#https://decimal.omixsystems.store#g; s#Phikila#Decimal#g; s#PHIKILA#DECIMAL#g; s#phikila#decimal#g' "$file"
          done <<< "$files"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Rename Phikila to Decimal'
          git push
