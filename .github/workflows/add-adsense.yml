name: Add AdSense

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-adsense:
    if: ${{ !contains(github.event.head_commit.message, 'Add Google AdSense') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AdSense tags safely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          meta = '<meta name="google-adsense-account" content="ca-pub-2597448028967441">'
          script = '''<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2597448028967441"
               crossorigin="anonymous"></script>'''

          changed = False
          marker = '</head>'

          if 'google-adsense-account' not in text:
              if marker not in text:
                  raise SystemExit('Safety check failed: </head> was not found.')
              text = text.replace(marker, meta + '\n' + marker, 1)
              changed = True

          if 'ca-pub-2597448028967441' not in text:
              if marker not in text:
                  raise SystemExit('Safety check failed: </head> was not found.')
              text = text.replace(marker, script + '\n' + marker, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('AdSense tags added before </head>.')
          else:
              print('AdSense tags already present; no changes needed.')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Google AdSense'
          git push

# Safe trigger to apply the AdSense insertion without replacing index.html manually.
