<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f4f0e6">
<meta name="description" content="Request a project quote from OMIX Digital Solutions.">
<title>Get a Quote — OMIX Digital Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f0e6;--ink:#111;--muted:#585858;--acid:#d7ff00;--line:3px solid var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif;line-height:1.45}.wrap{width:min(1080px,calc(100% - 32px));margin:auto}.mono{font-family:'DM Mono',monospace}header{border-bottom:var(--line);padding:20px 0}.brand{font-weight:700;font-size:1.25rem;text-decoration:none}.brand span{background:var(--ink);color:var(--acid);padding:0 5px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{font-weight:700;text-decoration:none}main{padding:70px 0}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:45px;align-items:start}.eyebrow{display:inline-block;background:var(--acid);border:var(--line);padding:7px 10px;box-shadow:5px 5px 0 var(--ink);font-weight:700;margin-bottom:24px}h1{font-size:clamp(3rem,7vw,6rem);line-height:.86;letter-spacing:-.07em;margin:0 0 25px}h1 em{font-style:normal;background:var(--ink);color:var(--paper);padding:0 8px}.intro{font-size:1.15rem;color:var(--muted);max-width:500px}.card{background:#fff;border:var(--line);padding:28px;box-shadow:10px 10px 0 var(--ink)}.steps{display:flex;gap:6px;margin-bottom:25px}.step{height:6px;flex:1;background:#ccc}.step.active{background:var(--acid)}h2{margin:0 0 5px;font-size:1.65rem}.sub{font-family:'DM Mono',monospace;color:var(--muted);font-size:.72rem;margin-bottom:22px}.group{margin-bottom:14px}label{display:block;font-weight:700;font-size:.86rem;margin-bottom:6px}input,select,textarea{width:100%;padding:13px;border:2px solid #777;background:#fff;color:var(--ink);font:inherit}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:3px 3px 0 var(--acid)}textarea{resize:vertical;min-height:130px}.row{display:flex;gap:10px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 18px;border:var(--line);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;min-height:48px}.primary{background:var(--ink);color:var(--paper);width:100%}.acid{background:var(--acid);color:var(--ink);flex:1}.outline{background:#fff;flex:1}.error{color:#a3261c;font-size:.78rem;margin-top:5px}.hidden{display:none}.success{text-align:center;padding:20px 5px}.success-icon{font-size:3rem;font-weight:700}.success h2{font-size:2rem;margin-bottom:10px}.success p{color:var(--muted)}.whatsapp{display:block;background:#25D366;color:#071b0d;text-align:center;border:var(--line);padding:15px;font-weight:700;text-decoration:none;margin-top:15px}.note{font-size:.75rem;color:var(--muted);margin-top:14px}.required{color:#a3261c}@media(max-width:800px){main{padding:45px 0}.grid{grid-template-columns:1fr;gap:30px}.card{box-shadow:6px 6px 0 var(--ink)}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="https://omixsystems.store/">OMIX<span>SYSTEMS</span></a><a class="back" href="https://omixsystems.store/">← Back to OMIX</a></div></header>
<main><div class="wrap grid"><section><div class="eyebrow mono">OMIX / PROJECT INTAKE</div><h1>LET'S BUILD<br><em>IT.</em></h1><p class="intro">Tell us what you need. We'll review the request and continue the conversation directly with you.</p><p class="mono" style="font-size:.78rem;margin-top:28px">FASTEST RESPONSE: WHATSAPP</p></section>
<section class="card" id="formCard"><div class="steps"><div class="step active" id="s1"></div><div class="step" id="s2"></div><div class="step" id="s3"></div></div><div id="form"></div></section></div></main>
<script>
(function(){
const WA='254768213649';let step=1;let data={name:'',business:'',phone:'',email:'',service:'',budget:'',timeline:'',details:''};
const form=document.getElementById('form');
function render(){document.querySelectorAll('.step').forEach((e,i)=>e.classList.toggle('active',i<step));let h='';
if(step===1)h='<h2>About you</h2><div class="sub">STEP 1 OF 3</div><div class="group"><label>Name <span class="required">*</span></label><input id="name" value="'+esc(data.name)+'" placeholder="Your name"></div><div class="group"><label>Business / Organization</label><input id="business" value="'+esc(data.business)+'" placeholder="Business name"></div><div class="group"><label>WhatsApp number <span class="required">*</span></label><input id="phone" value="'+esc(data.phone)+'" placeholder="e.g. 0768 213 649"></div><div class="group"><label>Email</label><input id="email" type="email" value="'+esc(data.email)+'" placeholder="you@example.com"></div><button class="btn acid" style="width:100%" onclick="next()">Continue →</button>';
if(step===2)h='<h2>What are you building?</h2><div class="sub">STEP 2 OF 3</div><div class="group"><label>Service <span class="required">*</span></label><select id="service"><option value="">Select a service</option><option>Website Development</option><option>E-commerce</option><option>Mobile App</option><option>Business Management System</option><option>API / Integration</option><option>Automation / AI</option><option>Custom Software</option><option>Other</option></select></div><div class="group"><label>Budget range</label><select id="budget"><option value="">Prefer not to say</option><option>KES 10,000 – 30,000</option><option>KES 30,000 – 75,000</option><option>KES 75,000 – 150,000</option><option>KES 150,000+</option></select></div><div class="group"><label>When would you like to start?</label><select id="timeline"><option value="">Select</option><option>ASAP</option><option>Within 1 month</option><option>1–3 months</option><option>Just exploring</option></select></div><div class="row"><button class="btn outline" onclick="prev()">← Back</button><button class="btn acid" onclick="next()">Continue →</button></div>';
if(step===3)h='<h2>Project details</h2><div class="sub">STEP 3 OF 3</div><div class="group"><label>Tell us what you need</label><textarea id="details" placeholder="What are you trying to build? Include anything important you already know.">'+esc(data.details)+'</textarea></div><div class="row"><button class="btn outline" onclick="prev()">← Back</button><button class="btn acid" onclick="submit()">Send Request →</button></div><p class="note">Your request opens WhatsApp so you can continue directly with OMIX. We do not hide the handoff behind a generic contact form.</p>';
form.innerHTML=h;if(step===2){document.getElementById('service').value=data.service;document.getElementById('budget').value=data.budget;document.getElementById('timeline').value=data.timeline}}
function save(){['name','business','phone','email','service','budget','timeline','details'].forEach(k=>{let e=document.getElementById(k);if(e)data[k]=e.value})}
window.next=function(){save();if(step===1&&(!data.name.trim()||!data.phone.trim())){alert('Please enter your name and WhatsApp number.');return}if(step===2&&!data.service){alert('Please select a service.');return}if(step<3)step++;render()};window.prev=function(){save();if(step>1)step--;render()};window.submit=function(){save();let msg='Hi OMIX Digital Solutions, I would like to discuss a project.\n\nProject request\nName: '+data.name+'\nBusiness: '+(data.business||'Not provided')+'\nWhatsApp: '+data.phone+'\nEmail: '+(data.email||'Not provided')+'\nService: '+data.service+'\nBudget: '+(data.budget||'Not provided')+'\nTimeline: '+(data.timeline||'Not provided')+'\n\nDetails:\n'+(data.details||'Not provided');let url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);form.innerHTML='<div class="success"><div class="success-icon">✓</div><h2>Request prepared</h2><p>Your project brief is ready. Continue on WhatsApp and an OMIX team member can respond directly.</p><a class="whatsapp" href="'+url+'">Continue on WhatsApp →</a><p class="note">If WhatsApp does not open, save this number: 0768 213 649.</p></div>';document.querySelectorAll('.step').forEach(e=>e.classList.add('active'))};function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}render();
})();
</script>
</body>
</html>
